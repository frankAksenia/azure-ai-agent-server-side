manager_agent:
  name: "manager-agent"
  description: "An agent that manages and coordinates tasks."
  model: "gpt-5.1"
  temperature: 0.3

billing_agent:
  name: "billing-agent"
  description: >-
    Billing policies with PDF citations and customer-owned invoice lookups.
    Handles requests to open support tickets by preparing proposals for an
    owned invoice and specific issue. Looks up existing tickets by ticket ID.
    Proposals require application confirmation; the application creates
    tickets and cancels proposals. Cannot issue refunds, modify invoices,
    or cancel existing tickets.
  model: "gpt-5.1"
  temperature: 0.5

technical_agent:
  name: "technical-agent"
  description: >-
    Technical troubleshooting, API latency analysis, and incident-triage
    guidance using technical PDF knowledge and source citations. No customer-record lookup or action tools.
  model: "gpt-5.1"
  temperature: 0.5

support_agent:
  name: "support-agent"
  description: >-
    General customer experience and account-access guidance based on
    support PDF knowledge and source citations. No invoice or ticket-management tools. Ticket
    proposals and status lookups belong to the specialist whose description
    declares those capabilities. Cannot authenticate a customer or act on
    application confirmation.
  model: "gpt-5.1"
  temperature: 0.5
